models:
  - name: stg_jaffle_shop__customers
    description: Customer data. One unique customer per row
    columns:
      - name: customer_id
        description: Primary key for the customer
        data_tests:
          - unique
          - not_null
      - name: first_name
        data_tests:
          - not_null
      - name: last_name
        data_tests:
          - not_null

  - name: stg_jaffle_shop__orders
    description: Orders data. One unique order per row
    columns:
      - name: order_id
        description: Primary key for orders table.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
      - name: order_date
        data_tests:
          - not_null
      - name: status
        description: "{{ doc('order_status') }}"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['completed', 'placed', 'shipped', 'return_pending', 'returned']
      - name: _etl_loaded_at
        data_tests:
          - not_null
